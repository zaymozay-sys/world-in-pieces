name: Spell balance candidate verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [balance/spell-economy-audit]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm ci --prefix server
      - run: npx playwright install --with-deps chromium
      - name: Regression suite
        run: npm test
      - name: Two-client PvP (preparation and area spells)
        env:
          FORCE: temper,mirror,square,fire
        run: node tools/live-e2e.js 1
      - name: Two-client PvP (ordinary tactical play)
        run: node tools/live-e2e.js 1
      - name: Browser checks
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/wip-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/index.html >/dev/null; then break; fi
            sleep 1
          done
          node tests/wiki-browser.cjs
      - name: 100 automated battles
        env:
          WIP_PLAYER_MODE: soak
          WIP_URL: http://127.0.0.1:8765/
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/wip-soak.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/index.html >/dev/null; then break; fi
            sleep 1
          done
          npm run test:player
      - run: python3 tools/dist.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spell-balance-candidate
          path: |
            test-results/
            dist/
          if-no-files-found: warn
