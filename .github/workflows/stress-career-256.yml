name: Stress career and drop coverage 2.5.6
on:
  push:
    branches: [qa/progression-stress-256]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [old, new]
        faction: [human, dwarf, elf, lizard]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Simulate low-skill career without daily rewards
        env:
          WIP_STRESS: 1
          WIP_MAX_BATTLES: 14000
          WIP_MODES: ${{ matrix.mode }}
          WIP_FACTIONS: ${{ matrix.faction }}
        run: node tools/qa-career-256.js
      - name: Report results
        run: |
          node -e 'const r=require("./balance-career.json")[0];for(const l of r.levels.filter(x=>[1,10,20,30,40,50,60,70,80,90,99].includes(x.level)))console.log("CHECKPOINT",JSON.stringify(l));console.log("FINAL",JSON.stringify({mode:r.mode,faction:r.faction,level:r.level,battles:r.battles,wins:r.wins,coins:r.coins,maxPoor:r.maxPoor}))'
      - uses: actions/upload-artifact@v4
        with:
          name: stress-${{ matrix.mode }}-${{ matrix.faction }}
          path: balance-career.json
          if-no-files-found: error
  drops:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/qa-drops-256.js
      - uses: actions/upload-artifact@v4
        with:
          name: drop-coverage-256
          path: balance-drops.json
          if-no-files-found: error
