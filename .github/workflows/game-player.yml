name: Game player — browser smoke and full journey

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "js/**"
      - "css/**"
      - "tests/game-player.e2e.js"
      - "tools/browser.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/game-player.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "Smoke: 1 battle; full: 10; soak: 100 battles with loot report"
        type: choice
        required: true
        default: full
        options:
          - smoke
          - full
          - soak
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  # Do not cancel a 100-fight marathon when another code change is pushed.
  group: game-player-${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[test:100]') && 'soak' || 'regular' }}
  cancel-in-progress: false

jobs:
  game-player:
    name: Automatic game player (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WIP_PLAYER_MODE: ${{ github.event_name == 'schedule' && 'full' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[test:100]') && 'soak') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[test:10]') && 'full') || (inputs.mode || 'smoke') }}
      CI: "true"
    steps:
      - name: Checkout game
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Check JavaScript syntax
        run: node tests/syntax.test.js
      - name: Run test player over local HTTP
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/wip-player-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/index.html >/dev/null; then break; fi
            sleep 1
          done
          export WIP_URL=http://127.0.0.1:8765/index.html
          npm run test:player
      - name: Upload report, screenshots and failure details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-player-report
          path: test-results/game-player/
          retention-days: 14
          if-no-files-found: warn
